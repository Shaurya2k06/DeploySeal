services:
  - type: web
    name: deployseal-backend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci --prefix server
    startCommand: HOST=0.0.0.0 npm --prefix server start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - server/**
        - contracts/deployseal/**
        - render.yaml
        - .node-version
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.11.1
