name: DeploySeal demo artifact

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1

      - run: npm ci --prefix contracts/deployseal
      - run: npm ci --prefix server

      - name: Build deterministic demo artifact
        run: node -e "require('node:fs').writeFileSync('deployseal-demo.artifact', 'DeploySeal demo artifact\\ncommit=' + process.env.GITHUB_SHA + '\\n')"

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: deployseal-demo.artifact

      - name: Verify artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify deployseal-demo.artifact --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployseal-demo.yml"

      - name: Capture OIDC token for BuildFact adapter
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'
          const response = await fetch(`${process.env.ACTIONS_ID_TOKEN_REQUEST_URL}&audience=deployseal`, {
            headers: { authorization: `bearer ${process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN}` },
          })
          if (!response.ok) throw new Error(`OIDC request failed: ${response.status}`)
          const body = await response.json()
          writeFileSync(`${process.env.RUNNER_TEMP}/deployseal-oidc.jwt`, body.value, { mode: 0o600 })
          NODE

      - name: Load allowlisted adapter key
        env:
          DEPLOYSEAL_BUILD_ADAPTER_PRIVATE_KEY: ${{ secrets.DEPLOYSEAL_BUILD_ADAPTER_PRIVATE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createPrivateKey, createPublicKey } from 'node:crypto'
          import { writeFileSync } from 'node:fs'
          if (!process.env.DEPLOYSEAL_BUILD_ADAPTER_PRIVATE_KEY) {
            throw new Error('Configure the DEPLOYSEAL_BUILD_ADAPTER_PRIVATE_KEY repository secret before running this workflow')
          }
          const privateKey = createPrivateKey(process.env.DEPLOYSEAL_BUILD_ADAPTER_PRIVATE_KEY)
          const publicKey = createPublicKey(privateKey)
          writeFileSync(`${process.env.RUNNER_TEMP}/deployseal-adapter-key.pem`, privateKey.export({ format: 'pem', type: 'pkcs8' }), { mode: 0o600 })
          writeFileSync(`${process.env.RUNNER_TEMP}/deployseal-adapter-key.pub.pem`, publicKey.export({ format: 'pem', type: 'spki' }), { mode: 0o644 })
          NODE

      - name: Build signed BuildFact
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYSEAL_BUILD_FACT_TTL_SECONDS: 86400
        run: |
          node server/src/build-fact.js \
            --artifact deployseal-demo.artifact \
            --repository "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/deployseal-demo.yml" \
            --oidc-token-file "$RUNNER_TEMP/deployseal-oidc.jwt" \
            --private-key-file "$RUNNER_TEMP/deployseal-adapter-key.pem" \
            --public-key-file "$RUNNER_TEMP/deployseal-adapter-key.pub.pem" \
            --adapter-key-id github-actions-build-adapter-v1 \
            --audience deployseal \
            --repository-id "$(gh api "repos/$GITHUB_REPOSITORY" --jq .id)" \
            --workflow "DeploySeal demo artifact" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/build-fact.json"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployseal-demo-artifact
          path: |
            deployseal-demo.artifact
            ${{ runner.temp }}/build-fact.json

      - name: Log in to Azure with workload identity
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DEPLOYSEAL_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DEPLOYSEAL_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DEPLOYSEAL_AZURE_SUBSCRIPTION_ID }}

      - name: Publish the signed BuildFact to the Azure coordinator
        env:
          AZURE_KEY_VAULT: deploysealkv260912
        run: |
          az keyvault secret set --vault-name "$AZURE_KEY_VAULT" --name build-fact-json --file "$RUNNER_TEMP/build-fact.json" --only-show-errors >/dev/null
          az keyvault secret set --vault-name "$AZURE_KEY_VAULT" --name build-adapter-public-key --file "$RUNNER_TEMP/deployseal-adapter-key.pub.pem" --only-show-errors >/dev/null

      - name: Check signed EvidenceFacts before rollout
        if: ${{ vars.DEPLOYSEAL_AZURE_DEPLOY_ENABLED == 'true' }}
        env:
          AZURE_KEY_VAULT: deploysealkv260912
        run: |
          for name in evidence-facts-json evidence-adapter-public-key; do
            if ! az keyvault secret show --vault-name "$AZURE_KEY_VAULT" --name "$name" --query id --output tsv --only-show-errors >/dev/null; then
              echo "Missing Azure Key Vault secret: $name. Publish the real signed EvidenceFacts bundle before enabling rollout."
              exit 1
            fi
          done

      - name: Roll the Azure broker to this commit
        if: ${{ vars.DEPLOYSEAL_AZURE_DEPLOY_ENABLED == 'true' }}
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.DEPLOYSEAL_AZURE_RESOURCE_GROUP }}
          AZURE_VM: ${{ vars.DEPLOYSEAL_AZURE_VM }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo 'Set DEPLOYSEAL_AZURE_RESOURCE_GROUP'; exit 1; }
          test -n "$AZURE_VM" || { echo 'Set DEPLOYSEAL_AZURE_VM'; exit 1; }
          rollout_output=$(az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM" \
            --command-id RunShellScript \
            --scripts 'set -eu; bash /opt/deployseal/ops/azure/upgrade-live.sh' \
            --only-show-errors \
            --query 'value[].message' \
            --output tsv)
          printf '%s\n' "$rollout_output"
          printf '%s\n' "$rollout_output" | grep -q 'broker=active' || {
            echo 'Azure broker did not become active after rollout'
            exit 1
          }

      - name: Enable Azure HTTPS and private gateway authentication
        if: ${{ vars.DEPLOYSEAL_AZURE_DEPLOY_ENABLED == 'true' && vars.DEPLOYSEAL_AZURE_SECURE_ENABLED == 'true' }}
        env:
          AZURE_RESOURCE_GROUP: ${{ vars.DEPLOYSEAL_AZURE_RESOURCE_GROUP }}
          AZURE_VM: ${{ vars.DEPLOYSEAL_AZURE_VM }}
          DEPLOYSEAL_PUBLIC_HOST: ${{ vars.DEPLOYSEAL_PUBLIC_HOST }}
          DEPLOYSEAL_CLIENT_ORIGIN: ${{ vars.DEPLOYSEAL_CLIENT_ORIGIN }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo 'Set DEPLOYSEAL_AZURE_RESOURCE_GROUP'; exit 1; }
          test -n "$AZURE_VM" || { echo 'Set DEPLOYSEAL_AZURE_VM'; exit 1; }
          test -n "$DEPLOYSEAL_PUBLIC_HOST" || { echo 'Set DEPLOYSEAL_PUBLIC_HOST'; exit 1; }
          test -n "$DEPLOYSEAL_CLIENT_ORIGIN" || { echo 'Set DEPLOYSEAL_CLIENT_ORIGIN'; exit 1; }
          case "$DEPLOYSEAL_PUBLIC_HOST" in ''|*[!A-Za-z0-9.-]*) echo 'DEPLOYSEAL_PUBLIC_HOST must be a DNS hostname'; exit 1 ;; esac
          case "$DEPLOYSEAL_CLIENT_ORIGIN" in https://[A-Za-z0-9.-]*) ;; *) echo 'DEPLOYSEAL_CLIENT_ORIGIN must be an HTTPS hostname origin'; exit 1 ;; esac
          client_origin_host=${DEPLOYSEAL_CLIENT_ORIGIN#https://}
          case "$client_origin_host" in ''|*[!A-Za-z0-9.-]*) echo 'DEPLOYSEAL_CLIENT_ORIGIN must be an HTTPS hostname origin'; exit 1 ;; esac
          az vm run-command invoke \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$AZURE_VM" \
            --command-id RunShellScript \
            --scripts "/opt/deployseal/ops/azure/secure-live.sh '$DEPLOYSEAL_PUBLIC_HOST' '$DEPLOYSEAL_CLIENT_ORIGIN'" \
            --only-show-errors >/dev/null
